name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# مطلوب لإنشاء Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # يولّد مجلد android ويضبط الصلاحيات ثم flutter pub get
      - name: Setup project
        run: bash ./setup.sh

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk github-zip-pusher.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-zip-pusher-apk
          path: github-zip-pusher.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: GitHub ZIP Pusher v1.0.${{ github.run_number }}
          files: github-zip-pusher.apk
          generate_release_notes: true
