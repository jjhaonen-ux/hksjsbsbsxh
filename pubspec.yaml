name: github_zip_pusher
description: رفع مشروع من ملف ZIP إلى مستودع GitHub جديد.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.7.0
  archive: ^3.6.1
  flutter_secure_storage: ^9.2.2
  file_picker: ^8.1.2
  path: ^1.9.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
