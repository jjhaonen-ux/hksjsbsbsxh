name: github_zip_pusher
description: رفع مشروع من ملف ZIP إلى مستودع GitHub جديد.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.7.0
  archive: ^4.0.9
  flutter_secure_storage: ^11.0.0
  file_picker: ^10.3.10
  path: ^1.9.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
